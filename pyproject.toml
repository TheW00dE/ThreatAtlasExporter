[project]
name = "threatatlas-exporter"
version = "0.1.0"
description = "CLI to pull, validate and report on OWASP ThreatAtlas threat models, and to manage them as code."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "weasyprint>=70",
]

[project.optional-dependencies]
# OS keyring support for `tae auth login` on workstations. Not used in containers.
keyring = ["keyring>=25"]

[project.scripts]
tae = "tae.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "pypdf>=4",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tae"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = [
    "B008",    # Typer uses function calls in argument defaults
    "RUF001",  # × and – are used deliberately in user-facing text
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["tae"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["keyring", "keyring.*", "weasyprint", "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["tae"]
branch = true

[tool.uv]
# fonttools 4.69.0 was published with wheels for CPython 3.11 only; skip it.
constraint-dependencies = ["fonttools!=4.69.0"]
