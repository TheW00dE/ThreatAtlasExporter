# Example tae config. Copy to ~/.config/tae/config.toml (or mount at
# /config/tae/config.toml in the container) and adjust.
#
# Tokens are never stored here: use TAE_TOKEN, TAE_TOKEN_FILE, token_file,
# or `tae auth login`.

default_profile = "prod"

[profiles.prod]
url = "https://threatatlas.example.com"
# ca_bundle = "/etc/ssl/certs/internal-ca.pem"   # internal CA
# token_file = "~/.config/tae/prod.token"
timeout = 30
retries = 3

[profiles.test]
url = "https://threatatlas-test.example.com"

[profiles.local]
url = "http://localhost:3001"   # docker-compose frontend; its /api proxy reaches the backend
